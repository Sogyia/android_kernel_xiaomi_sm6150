name: Kernel Build

on:
  push:
    branches:
      - [ "15.0" ]
  pull_request:
    branches:
      - [ "15.0" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get -qq install git make bc bison \
          openssl curl zip kmod cpio flex libelf-dev \
          libssl-dev libtfm-dev wget device-tree-compiler \
          ca-certificates python3 python2 binutils \
          binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

    - name: Clone Clang toolchain
      run: |
        git clone --depth=1 https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r547379 "$HOME/clang"
        echo "Clang toolchain cloned to $HOME/clang"

    - name: Set environment variables
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export HEADER_ARCH=arm64
        export KBUILD_BUILD_HOST="localhost"
        export KBUILD_BUILD_USER="sogyia"
        export PATH="$HOME/clang/bin:$PATH"
        export KBUILD_COMPILER_STRING=$("$HOME/clang/bin/clang" --version | head -n 1 | perl -pe 's/\(http.*?\)//gs' | sed -e 's/  */ /g' -e 's/[[:space:]]*$//')
        echo "Clang version: $KBUILD_COMPILER_STRING"
        mkdir -p out

    - name: Clean and prepare
      run: |
        make clean && make mrproper

    - name: Configure kernel
      run: |
        make vendor/sdmsteppe-perf_defconfig O=out
        make vendor/davinci.config O=out

    - name: Build kernel
      run: |
        make -j$(nproc --all) O=out \
          ARCH=arm64 \
          LLVM=1 \
          LLVM_IAS=1 \
          AR=llvm-ar \
          NM=llvm-nm \
          LD=ld.lld \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          STRIP=llvm-strip \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-android- \
          CROSS_COMPILE_ARM32=arm-linux-androideabi- 2>&1 | tee error.log

    - name: Check for build artifacts
      id: check_artifacts
      run: |
        if [ -f out/arch/arm64/boot/Image.gz ]; then
          echo "Image.gz exists"
          echo "image_gz_exists=true" >> $GITHUB_OUTPUT
        else
          echo "Image.gz does not exist"
          echo "image_gz_exists=false" >> $GITHUB_OUTPUT
        fi

        if [ -f out/arch/arm64/boot/dts/vendor/qcom/dtbo.img ]; then
          echo "dtbo.img exists"
          echo "dtbo_exists=true" >> $GITHUB_OUTPUT
        else
          echo "dtbo.img does not exist"
          echo "dtbo_exists=false" >> $GITHUB_OUTPUT
        fi

        if [ -f out/arch/arm64/boot/dts/vendor/qcom/dtb.img ]; then
          echo "dtb.img exists"
          echo "dtb_exists=true" >> $GITHUB_OUTPUT
        else
          echo "dtb.img does not exist"
          echo "dtb_exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Upload artifacts to release
      if: github.event_name == 'push' && (steps.check_artifacts.outputs.image_gz_exists == 'true' || steps.check_artifacts.outputs.dtbo_exists == 'true' || steps.check_artifacts.outputs.dtb_exists == 'true')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          out/arch/arm64/boot/Image.gz
          out/arch/arm64/boot/dts/vendor/qcom/dtbo.img
          out/arch/arm64/boot/dts/vendor/qcom/dtb.img
